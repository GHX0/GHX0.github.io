<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>郭汉鑫 · GHX0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            color: #adb5bd;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 15px;
            color: #868e96;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .divider {
            width: 48px;
            height: 2px;
            background: #dee2e6;
            margin: 0 auto 24px;
        }
        .links a {
            display: inline-block;
            margin: 0 10px;
            color: #495057;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .links a:hover {
            color: #1a73e8;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👤</div>
        <h1>郭汉鑫</h1>
        <div class="subtitle">
            这个人很懒，什么都没写
        </div>
        <div class="divider"></div>
        <div class="links">
            <a href="https://github.com/GHX0" target="_blank">GitHub</a>
        </div>
        <div class="footer">GHX0</div>
    </div>
</body>
</html>
